server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Long-lived cache for hashed assets (JS/CSS bundles from Vite)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Short cache for images and other static files
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # GaadiGanit lives at gg.nthakur.com (its own Cloud Run service).
    # /gg and /gaadiganit (plus any subpath and query string) redirect there.
    location ~ ^/(gg|gaadiganit)(/.*)?$ {
        return 301 https://gg.nthakur.com$2$is_args$args;
    }

    # Serve pre-rendered HTML when available; fall back to SPA shell
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Security headers (inherited by location / which serves the HTML pages)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy, in report-only mode first: browsers log violations in the
    # console without blocking anything. Switch the header name to
    # Content-Security-Policy once the console is clean on the main pages.
    # The sha256 allows the Google Analytics consent snippet in index.html; if that script
    # changes, `npm run check` (scripts/check-csp.mjs) prints the new hash to put here.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-mhNx4OVXRgY1txzILdG2ZHXaqbyWoy9gGH4GFFTeev4=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
