server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Long-lived cache for hashed assets (JS/CSS bundles from Vite)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Short cache for images and other static files
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # GaadiGanit lives at gg.nthakur.com (its own Cloud Run service).
    # /gg and /gaadiganit (plus any subpath and query string) redirect there.
    location ~ ^/(gg|gaadiganit)(/.*)?$ {
        return 301 https://gg.nthakur.com$2$is_args$args;
    }

    # Every route is pre-rendered (prerender.ts), so a URL with no file is a real 404.
    # The 404 page is the prerendered NotFound route (dist/404.html).
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security headers (inherited by location / which serves the HTML pages)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy (enforcing). e2e/csp.spec.ts loads every page with this exact
    # policy and fails on any violation, so run `npm run test:e2e` after changing it.
    # The sha256 allows the Google Analytics consent snippet in index.html; if that script
    # changes, `npm run check` (scripts/check-csp.mjs) prints the new hash to put here.
    # GA4 sends hits to www.google.com/g/collect as well as *.google-analytics.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-zHEGLxtZgjLlpeuIrj6UwjjcQPYGhik0rHEZEbRM+zk=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
